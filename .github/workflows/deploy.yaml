name: deploy

on:
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Faz checkout no Pull Request
      uses: actions/checkout@v3

    - name: Instala o Nix
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.config/nix"
        printf 'experimental-features = nix-command flakes\nsandbox = false\n' > "$HOME/.config/nix/nix.conf"
        BASE_URL='https://raw.githubusercontent.com/ES-Nix/get-nix/'
        SHA256=87fa0f1dbfdd28a1f99b39d5bd4dcc39de97bc64
        NIX_RELEASE_VERSION='2.35.3'
        curl -fsSL --retry 3 "${BASE_URL}${SHA256}/get-nix.sh" | sh -s -- "${NIX_RELEASE_VERSION}"
        . "$HOME"/.nix-profile/etc/profile.d/nix.sh
        export TMPDIR=/tmp
        nix flake --version
        nix registry pin nixpkgs github:NixOS/nixpkgs/ea4c80b39be4c09702b0cb3b42eab59e2ba4f24b
        echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

    - name: Build
      run: nix develop .# --command sh -c 'cd brado && cargo build --release --verbose'

    - name: Deploy
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: nix develop .# --command sh -c 'cd brado && cargo login $CARGO_REGISTRY_TOKEN && cargo publish'
