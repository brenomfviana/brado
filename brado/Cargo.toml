[package]
name = "brado"
description = "brado is a brazilian docs validator"
readme = "../README.md"
keywords = ["brazilian", "docs", "validator"]
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["cpf", "cnpj", "cnh", "cns", "nis", "eleitoral", "renavam", "certidao"]
cpf = ["dep:brado_cpf"]
cnpj = ["dep:brado_cnpj"]
cnh = ["dep:brado_cnh"]
cns = ["dep:brado_cns"]
nis = ["dep:brado_nis"]
eleitoral = ["dep:brado_eleitoral"]
renavam = ["dep:brado_renavam"]
certidao = ["dep:brado_certidao"]
derive = ["dep:brado_derive"]

[dependencies]
brado_core.workspace = true
brado_derive = { workspace = true, optional = true }
brado_cnh = { workspace = true, optional = true }
brado_cnpj = { workspace = true, optional = true }
brado_cns = { workspace = true, optional = true }
brado_cpf = { workspace = true, optional = true }
brado_eleitoral = { workspace = true, optional = true }
brado_nis = { workspace = true, optional = true }
brado_renavam = { workspace = true, optional = true }
brado_certidao = { workspace = true, optional = true }
