[package]
name = "brado"
description = "brado is a brazilian docs validator"
readme = "../README.md"
keywords = ["brazilian", "docs", "validator"]
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["cpf", "cnpj", "cnh"]
cpf = ["dep:brado_cpf"]
cnpj = ["dep:brado_cnpj"]
cnh = ["dep:brado_cnh"]

[dependencies]
brado_core.workspace = true
brado_cnh = { workspace = true, optional = true }
brado_cnpj = { workspace = true, optional = true }
brado_cpf = { workspace = true, optional = true }
rand.workspace = true
