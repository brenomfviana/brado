[workspace]
members = [
    "brado",
    "brado_core",
    "brado_cnh",
    "brado_cnpj",
    "brado_cns",
    "brado_cpf",
    "brado_eleitoral",
    "brado_nis",
    "brado_renavam",
]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "MIT"
homepage = "https://github.com/brenomfviana/brado"
documentation = "https://docs.rs/brado"
repository = "https://github.com/brenomfviana/brado"
authors = ["Breno Viana", "Pedro Regis"]

[workspace.dependencies]
rand = "0.8.5"
brado_core = { path = "brado_core", version = "1.1.0" }
brado_cnh = { path = "brado_cnh", version = "1.1.0" }
brado_cnpj = { path = "brado_cnpj", version = "1.1.0" }
brado_cns = { path = "brado_cns", version = "1.1.0" }
brado_cpf = { path = "brado_cpf", version = "1.1.0" }
brado_eleitoral = { path = "brado_eleitoral", version = "1.1.0" }
brado_nis = { path = "brado_nis", version = "1.1.0" }
brado_renavam = { path = "brado_renavam", version = "1.1.0" }
